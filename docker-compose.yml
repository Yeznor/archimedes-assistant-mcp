services:
  context-ranker:
    build:
      context: ./python
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
